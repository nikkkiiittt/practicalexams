<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exam Documents</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f4f5;
            color: #18181b;
        }

        .container {
            width: 90%;
            max-width: 500px;
            text-align: center;
            background: white;
            padding: 45px 30px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .icon {
            font-size: 50px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 12px;
        }

        p {
            color: #71717a;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            width: 100%;
            padding: 15px 20px;
            background: #18181b;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            transition: 0.2s ease;
        }

        .button:hover {
            background: #3f3f46;
            transform: translateY(-2px);
        }

        .note {
            margin-top: 22px;
            font-size: 13px;
            color: #a1a1aa;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">📚</div>

        <h1>Exam Documents</h1>

        <p>
            Click the button below to access the required exam documents.
        </p>

        <a
            class="button"
            href="https://drive.google.com/drive/folders/1THMKQK735yinpZNmOfmmRE-f43fnBTzT?usp=sharing"
            target="_blank"
            rel="noopener noreferrer"
        >
            Open Exam Documents
        </a>

        <div class="note">
            Make sure you are signed in to the required Google account.
        </div>

    </div>

</body>
</html>
